# Broker MQTT del team (The Big Hack 2026) su twinciro.robertodisanto.it
# Eclipse Mosquitto 2.1.2. Manuale: https://mosquitto.org/man/mosquitto-conf-5.html
#
# Percorsi DENTRO il container (vedi compose.yaml):
#   /mosquitto/config    questa cartella (sola lettura): mosquitto.conf, acl, avvio.sh
#   /mosquitto/run       tmpfs: copie di certificati TLS e acl fatte da avvio.sh (uid 1883)
#   /mosquitto/utenti    ../segreti/utenti (non versionata, di uid 1883): passwd
#   /mosquitto/segreti   ../segreti (non versionata, sola lettura): certificati autofirmati
#   /mosquitto/data      volume: persistenza (sessioni, messaggi trattenuti)
#
# Ricarica a caldo (utenti, ACL, certificati, limiti), senza disconnettere nessuno:
#   ./scripts/ricarica.sh   (controlla, ricopia acl e certificati in /mosquitto/run, SIGHUP)
# Le opzioni "listener", "plugin" e "user" invece richiedono docker compose restart mosquitto.

# ------------------------------------------------------------------ generali
# Mosquitto parte come root (avvio.sh), poi scende all'utente "mosquitto" (uid 1883):
# per questo passwd e certificati devono essere leggibili da uid 1883 (ci pensa avvio.sh).
user mosquitto

# Nessun accesso anonimo, su nessuna porta.
allow_anonymous false

# Persistenza su volume: sessioni persistenti, code QoS 1/2 e messaggi trattenuti
# (es. lo stato online/offline dei dispositivi) sopravvivono a riavvii e aggiornamenti.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
# Sessioni persistenti di client che non tornano più (id casuali) eliminate dopo 14 giorni.
persistent_client_expiration 14d

# ------------------------------------------------------------------ log
# Su stdout: li raccoglie Docker (docker compose logs), con rotazione in compose.yaml.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# Statistiche in $SYS/# ogni 30 secondi (le legge l'utente monitor o admin).
sys_interval 30

# ------------------------------------------------------------------ limiti
# Connessioni contemporanee su tutto il broker (badge, ESP32, Tasmota, dashboard, servizi).
global_max_connections 1000
# Pacchetto massimo 256 KB: le letture JSON dei dispositivi stanno sotto 1 KB,
# il hub accetta al massimo 64 KB per richiesta. Chi supera viene disconnesso.
max_packet_size 262144
# Keepalive massimo 5 minuti. I client MQTT 3.1.1 che chiedono di più vengono rifiutati
# (Tasmota usa 30 s, PubSubClient 15 s, paho 60 s, ESP-IDF 120 s: tutti dentro).
max_keepalive 300
# Code per client lento o offline con sessione persistente (solo QoS 1/2).
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 4194304
# I messaggi trattenuti vengono riconsegnati solo se chi li ha pubblicati ha ancora i permessi.
check_retain_source true

# ------------------------------------------------------------------ autenticazione e permessi
# Plugin ufficiali (in 2.1 sostituiscono le vecchie opzioni password_file e acl_file).
# Utenti: ./scripts/aggiungi-utente.sh   Permessi: config/acl (poi ./scripts/ricarica.sh).
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/utenti/passwd

plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/run/acl

# ------------------------------------------------------------------ porte
# 1883: MQTT in chiaro, SOLO con utente e password. Per Tasmota su ESP8266 e firmware
# senza TLS. La password viaggia in chiaro: usa un utente diverso per ogni dispositivo.
listener 1883
protocol mqtt

# 8883: MQTT su TLS (consigliata per ESP32, badge, ponte, c5 e amministrazione).
listener 8883
protocol mqtt
certfile /mosquitto/run/fullchain.pem
keyfile /mosquitto/run/privkey.pem

# 8884: MQTT su WebSocket con TLS (wss://) per le dashboard nel browser.
# Le pagine https (GitHub Pages) possono usare solo wss://, non ws://.
listener 8884
protocol websockets
certfile /mosquitto/run/fullchain.pem
keyfile /mosquitto/run/privkey.pem

# 9001: WebSocket in chiaro. In compose.yaml è pubblicata solo su 127.0.0.1 del server:
# serve a un eventuale reverse proxy (nginx) che termina TLS sulla 443, vedi esempi/.
listener 9001
protocol websockets
