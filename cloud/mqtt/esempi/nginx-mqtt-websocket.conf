# OPZIONALE: wss://cloud.robertodisanto.it/mqtt sulla porta 443, tramite un nginx GIÀ presente
# sul server. Serve solo se una rete (es. il Wi-Fi dell'evento) blocca la porta 8884:
# la 443 passa quasi sempre. Il broker resta com'è: nginx termina TLS e inoltra al
# WebSocket in chiaro di Mosquitto, pubblicato solo su 127.0.0.1:9001 (WS_PORTA in .env).
#
# Se sulla 443 del server non c'è nulla, non serve nginx: in .env metti WSS_PORTA=443
# e Mosquitto risponde direttamente su wss://cloud.robertodisanto.it/ (443).
#
# Installazione: copia questo blocco "location" dentro il server { listen 443 ssl; ... }
# di cloud.robertodisanto.it (es. /etc/nginx/sites-available/cloud.robertodisanto.it),
# poi: sudo nginx -t && sudo systemctl reload nginx
# Nelle dashboard: wss://cloud.robertodisanto.it/mqtt (porta 443, percorso /mqtt).

location /mqtt {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Connessioni MQTT lunghe: nginx chiuderebbe dopo 60 s senza traffico.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

