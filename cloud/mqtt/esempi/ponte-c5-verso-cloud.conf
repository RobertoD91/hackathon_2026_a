# Bridge dal Mosquitto locale di c5-agentic-city (portatile/plastico) al broker cloud.
# Il broker del plastico resta com'è (anonimo, rete dedicata, funziona anche senza
# internet); quando c'è rete copia napoli/# nei due sensi con twinciro.robertodisanto.it.
# Nessuna modifica al codice Python di c5: il bridge lo fa Mosquitto.
#
# Come usarlo (nella cartella c5-agentic-city, a cura del gruppo c5):
# 1. copia questo file in docker/ponte-cloud.conf, metti la password dell'utente "c5" al posto
#    di CAMBIAMI e NON versionarlo (aggiungi docker/ponte-cloud.conf al .gitignore);
# 2. in compose.yaml, servizio mosquitto, aggiungi il volume
#      - ./docker/ponte-cloud.conf:/mosquitto/config/conf.d/ponte-cloud.conf:ro
# 3. in docker/mosquitto.conf aggiungi in fondo la riga
#      include_dir /mosquitto/config/conf.d
# 4. docker compose up -d mosquitto; nei log: "Connecting bridge cloud-bighack".
# Senza il file (o con la cartella vuota) il broker locale funziona come prima.

connection cloud-bighack
address twinciro.robertodisanto.it:8883
# Certificato Let's Encrypt: basta fidarsi delle CA di sistema.
bridge_tls_use_os_certs true
# Con certificati autofirmati usa invece:  bridge_cafile /mosquitto/config/conf.d/ca.crt
remote_username c5
remote_password CAMBIAMI
remote_clientid c5-plastico-ponte
bridge_protocol_version mqttv311
cleansession true
keepalive_interval 60
# Riconnessione: da 5 s fino a 60 s tra un tentativo e l'altro.
restart_timeout 5 60
# Lo stato del bridge resta sul broker locale ($SYS/broker/connection/...): sul cloud
# l'utente c5 non può scrivere in $SYS.
notifications_local_only true

# Tutto il traffico della città nei due sensi (QoS 0, come il bus di c5).
topic napoli/# both 0
