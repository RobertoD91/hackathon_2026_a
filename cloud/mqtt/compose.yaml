# Broker MQTT del team (The Big Hack 2026) per twinciro.robertodisanto.it.
# Guida completa: README.md in questa cartella.
#
#   ./scripts/inizializza.sh                           prima installazione (.env, utenti; niente root)
#   docker compose up -d                               broker
#   docker compose logs -f mosquitto                   log del broker
#   ./scripts/prova.sh                                 prova completa (anonimo, formato napoli/, ACL; TLS se acceso)
#   docker compose --profile monitor run --rm monitor  stampa tutti i messaggi (Ctrl+C per uscire)
#
# Topic: solo il formato unico napoli/ di TwinCIRO (firmware/README.md e config/acl).
# Client: badge WHY2025 e scheda Tasmota (firmware/), città c5-agentic-city (utente c5).
#
# Porte sul server (modificabili in .env):
#   1883 MQTT con password, in chiaro: la porta del team (TLS spento di serie)
#   8883 MQTT su TLS · 8884 WebSocket su TLS (wss://): solo con MQTT_CERTIFICATI=letsencrypt|autofirmato
#   9001 WebSocket in chiaro solo su 127.0.0.1 (per un eventuale reverse proxy)
# Non serve root sul server: basta un utente che possa usare Docker.
# Il nome resta bighack-mqtt anche se i topic bighack/ non esistono più: sul server il volume si
# chiama bighack-mqtt_dati, e cambiarlo farebbe ripartire il broker da un volume vuoto.
name: bighack-mqtt

services:
  mosquitto:
    # Versione fissata (2.1.2 = "eclipse-mosquitto:2" a novembre 2026, la stessa di c5-agentic-city).
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    # avvio.sh (root nel container, non sul server): copia ACL e, se TLS è acceso, certificati in
    # /mosquitto/run e sistema i permessi, poi avvia Mosquitto, che scende all'utente mosquitto (uid 1883).
    entrypoint: ["/bin/sh", "/mosquitto/config/avvio.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_DOMINIO: ${MQTT_DOMINIO:-twinciro.robertodisanto.it}
      MQTT_CERTIFICATI: ${MQTT_CERTIFICATI:-nessuno}
    ports:
      - "${MQTT_PORTA:-1883}:1883"
      # Attive solo con TLS acceso (MQTT_CERTIFICATI≠nessuno); altrimenti nessuno risponde.
      - "${MQTTS_PORTA:-8883}:8883"
      - "${WSS_PORTA:-8884}:8884"
      - "${WS_INDIRIZZO:-127.0.0.1}:${WS_PORTA:-9001}:9001"
    volumes:
      - ./config:/mosquitto/config:ro
      # Utenti e password (hash): cartella di uid 1883, la gestiscono gli script in scripts/.
      - ./segreti/utenti:/mosquitto/utenti
      # Certificati autofirmati (se MQTT_CERTIFICATI=autofirmato), in sola lettura.
      - ./segreti:/mosquitto/segreti:ro
      # Certificati Let's Encrypt, in sola lettura: servono solo con MQTT_CERTIFICATI=letsencrypt.
      # Predefinito ./segreti (una cartella che esiste e basta). Con TLS acceso, LETSENCRYPT_DIR
      # va puntata a una cartella con live/<dominio>/{fullchain,privkey}.pem leggibile dall'utente.
      - ${LETSENCRYPT_DIR:-./segreti}:/etc/letsencrypt:ro
      - dati:/mosquitto/data
    tmpfs:
      # Copie di certificati e ACL fatte da avvio.sh: solo in memoria, mai su disco.
      - /mosquitto/run:mode=0700,size=1m
      # File temporanei di mosquitto_passwd (script in scripts/).
      - /tmp:mode=1777,size=4m
      # Log su stdout: tmpfs evita un volume anonimo (VOLUME /mosquitto/log dell'immagine)
      # a ogni avvio e a ogni "docker compose run" degli script.
      - /mosquitto/log:size=1m
    healthcheck:
      # Il broker è sano se risponde a MQTT E rifiuta la connessione anonima:
      # se qualcuno riaprisse l'accesso anonimo, il container risulterebbe "unhealthy".
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -i salute -t salute -m x 2>&1 | grep -qi 'not authori'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Indurimento: file system in sola lettura (scrive solo su dati, utenti e tmpfs) e solo
    # le capability che servono ad avvio.sh e agli script (copiare certificati e password,
    # cambiare proprietario, cambiare utente). Mosquitto stesso, sceso a uid 1883, non ne ha.
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    # File aperti: margine ampio per global_max_connections 1000 (un socket per client).
    ulimits:
      nofile: { soft: 16384, hard: 16384 }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Client di prova: si iscrive a MONITOR_TOPIC (predefinito: tutto) e stampa ogni messaggio
  # con data, topic e contenuto. Stessa immagine del broker, nessun download in più.
  #   docker compose --profile monitor run --rm monitor
  #   MONITOR_TOPIC='napoli/sensori/#' docker compose --profile monitor run --rm monitor
  monitor:
    image: eclipse-mosquitto:2.1.2-alpine
    profiles: ["monitor"]
    depends_on:
      mosquitto: { condition: service_healthy }
    environment:
      MQTT_USER: monitor
      MQTT_PASSWORD: ${MQTT_MONITOR_PASSWORD:-}
      MONITOR_TOPIC: ${MONITOR_TOPIC:-#}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec mosquitto_sub -h mosquitto -p 1883 -u "$$MQTT_USER" -P "$$MQTT_PASSWORD"
        -i "monitor-$$(hostname)" -t "$$MONITOR_TOPIC" -F '%I %t %p'
    # L'immagine dichiara VOLUME /mosquitto/data e /mosquitto/log: tmpfs per non lasciare
    # volumi anonimi a ogni avvio.
    tmpfs: [/mosquitto/data, /mosquitto/log]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Persistenza di Mosquitto (mosquitto.db). Backup: README, sezione "Backup".
  dati:
