# API dati città di Napoli (citta-api/): il "cervello dati" di CiroGPT.
# Guida completa: README.md in questa cartella.
#
#   cp .env.example .env && chmod 600 .env     configurazione (token, porta, CORS, rinfresco)
#   docker compose up -d --build                costruisce l'immagine e avvia
#   docker compose logs -f citta-api            log (una riga per richiesta)
#   ./prova.sh                                  /salute, /citta/riassunto, token
#   docker compose exec citta-api node citta-api/aggiorna.js --solo eventi   rigenera uno snapshot
#
# Porta sul server (modificabile in .env): 8791. Dietro un reverse proxy: CITTA_API_INDIRIZZO=127.0.0.1.
#
# HTTPS senza root (profilo "https"): nginx in un container davanti all'API, sulla 443.
#   in .env: CITTA_CERTIFICATI_DIR (cartella con fullchain.pem e privkey.pem, vedi ../certificati/)
#   docker compose --profile https up -d --build
#   ./prova.sh https://twinciro.robertodisanto.it/citta-api
name: bighack-citta-api

services:
  citta-api:
    build:
      # La radice della repo: l'immagine copia solo citta-api/ (contesto ridotto da
      # Dockerfile.dockerignore).
      context: ../..
      dockerfile: cloud/citta-api/Dockerfile
    image: bighack/citta-api:locale
    restart: unless-stopped
    ports:
      - "${CITTA_API_INDIRIZZO:-0.0.0.0}:${CITTA_API_PORTA:-8791}:8791"
    environment:
      # Token Bearer: se è vuoto l'API è aperta (solo /salute resta sempre senza token).
      CITTA_API_TOKEN: ${CITTA_API_TOKEN:-}
      # Origini ammesse dal browser (la mappa su GitHub Pages); * per tutte, vuoto per nessuna.
      CITTA_API_CORS: ${CITTA_API_CORS:-https://robertodisanto.it}
      # User-Agent verso le fonti (generico, mai dati personali; vuoto = predefinito dell'API).
      NAPOLI_UA: ${NAPOLI_UA:-}
      # Rinfresco degli snapshot dentro il processo: età massima di ogni sezione.
      CITTA_AGGIORNA: ${CITTA_AGGIORNA:-eventi=6h,aria=1h,meteo=3h,riferimenti=24h,trasporti=72h}
      # Fonti del riassunto rilette in anticipo ogni 5 minuti (solo quelle scadute).
      CITTA_TIENI_CALDO: ${CITTA_TIENI_CALDO:-1}
      # Pausa di un dominio dopo un 429 (limite di richieste della fonte).
      CITTA_PAUSA_429: ${CITTA_PAUSA_429:-15m}
    volumes:
      # Snapshot di lavoro (rigenerati dal rinfresco): sopravvivono a riavvii e nuove immagini.
      - dati:/dati
    healthcheck:
      # 200 se il processo risponde (non dipende dalle fonti esterne).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8791/salute"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Indurimento: file system in sola lettura (scrive solo nel volume /dati e in /tmp),
    # nessuna capability, utente node (uid 1000) dall'immagine.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        # 512 MB: il rinfresco dei trasporti legge i GTFS di ANM ed EAV (decine di MB).
        limits: { cpus: "1.0", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # HTTPS davanti all'API (profilo "https"): nginx/https.conf, certificati in sola lettura da
  # CITTA_CERTIFICATI_DIR. Rilegge i certificati da solo ogni 12 ore (rinnovi di Let's Encrypt).
  https:
    image: nginx:1.29-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      citta-api: { condition: service_healthy }
    ports:
      - "${CITTA_HTTPS_INDIRIZZO:-0.0.0.0}:${CITTA_HTTPS_PORTA:-443}:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CITTA_CERTIFICATI_DIR:-./certificati-mancanti}:/certificati:ro
    command:
      - /bin/sh
      - -c
      - >-
        test -r /certificati/fullchain.pem && test -r /certificati/privkey.pem
        || { echo "Mancano fullchain.pem e privkey.pem leggibili in CITTA_CERTIFICATI_DIR (vedi cloud/certificati/README.md)" >&2; exit 1; };
        (while sleep 43200; do nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/salute"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m
      - /var/run:size=1m
      - /tmp:size=4m
    # nginx parte come root nel container (porta 443) e i worker scendono all'utente nginx.
    # DAC_READ_SEARCH: leggere privkey.pem anche se è 0640 di un altro utente (Docker con root).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Snapshot di lavoro. Si possono sempre rigenerare: nessun backup necessario.
  dati:
