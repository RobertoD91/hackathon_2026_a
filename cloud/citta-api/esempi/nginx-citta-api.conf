# ALTERNATIVA, solo per chi ha root sul server (noi su twinciro.robertodisanto.it non l'abbiamo:
# usiamo il profilo "https" di compose.yaml con nginx/https.conf). L'API dietro l'nginx di sistema
# sulla 443, con il certificato Let's Encrypt. In .env: CITTA_API_INDIRIZZO=127.0.0.1.
#
# Due modi, scegline uno:
#   A) un percorso sul dominio esistente:  https://twinciro.robertodisanto.it/citta-api/citta/riassunto
#   B) un sottodominio dedicato:           https://citta.robertodisanto.it/citta/riassunto
#
# Dopo la modifica: sudo nginx -t && sudo systemctl reload nginx

# --- A) dentro il blocco server { listen 443 ssl; server_name twinciro.robertodisanto.it; ... } esistente
location /citta-api/ {
    proxy_pass http://127.0.0.1:8791/;          # la barra finale toglie il prefisso /citta-api
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # limite gentile per IP (definisci la zona nel blocco http: limit_req_zone $binary_remote_addr zone=citta:1m rate=5r/s;)
    # limit_req zone=citta burst=20 nodelay;
}

