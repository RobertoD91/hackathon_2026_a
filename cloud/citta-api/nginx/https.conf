# nginx del profilo "https" di compose.yaml: HTTPS davanti all'API dati città, senza root sul
# server e senza l'nginx di sistema. Certificati in /certificati (CITTA_CERTIFICATI_DIR in .env),
# preparati dall'amministratore con ../certificati/copia-certificati.sh (hook di certbot).
#
#   https://twinciro.robertodisanto.it/citta-api/citta/riassunto  →  http://citta-api:8791/citta/riassunto
#   https://twinciro.robertodisanto.it/salute                      →  stato di nginx stesso
#
# Il container rilegge i certificati da solo ogni 12 ore (nginx -s reload): dopo un rinnovo
# non serve fare nulla. Per farlo subito: docker compose exec https nginx -s reload

server_tokens off;

# Limite gentile per IP: TwinCIRO fa poche richieste, una pagina impazzita no.
limit_req_zone $binary_remote_addr zone=citta:1m rate=10r/s;

server {
    listen 443 ssl;   # solo IPv4 nel container: all'IPv6 verso il server pensa Docker
    http2 on;
    server_name _;

    ssl_certificate     /certificati/fullchain.pem;
    ssl_certificate_key /certificati/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /salute {
        default_type text/plain;
        return 200 "ok\n";
    }

    # L'API sotto /citta-api/: la barra finale di proxy_pass toglie il prefisso.
    location /citta-api/ {
        limit_req zone=citta burst=30 nodelay;
        proxy_pass http://citta-api:8791/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location = / {
        default_type text/plain;
        return 200 "TwinCIRO: API dati città su /citta-api/\n";
    }
}
