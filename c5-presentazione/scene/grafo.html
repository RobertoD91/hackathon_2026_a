  .testa { position: absolute; left: 72px; top: 30px; right: 72px; }

  .chip b { font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .chip.somma { display: block; line-height: 34px; background: transparent; border-color: transparent; color: var(--tenue); font-weight: 600; padding-left: 6px; }

  svg#grafo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

</style>

a"},{"a":76,"b":38,"t":"alimenta"},{"a":76,"b":39,"t":"alimenta"},{"a":76,"b":40,"t":"alimenta"},{"a":76,"b":41,"t":"alimenta"},{"a":76,"b":42,"t":"alimenta"},{"a":76,"b":43,"t":"alimenta"},{"a":76,"b":44,"t":"alimenta"},{"a":76,"b":45,"t":"alimenta"},{"a":76,"b":46,"t":"alimenta"},{"a":76,"b":47,"t":"alimenta"},{"a":76,"b":48,"t":"alimenta"},{"a":76,"b":49,"t":"alimenta"},{"a":77,"b":50,"t":"alimenta"},{"a":77,"b":51,"t":"alimenta"},{"a":77,"b":52,"t":"alimenta"},{"a":77,"b":53,"t":"alimenta"},{"a":78,"b":68,"t":"alimenta"},{"a":79,"b":63,"t":"alimenta"},{"a":79,"b":1,"t":"alimenta"},{"a":79,"b":2,"t":"alimenta"},{"a":79,"b":3,"t":"alimenta"},{"a":79,"b":5,"t":"alimenta"},{"a":79,"b":7,"t":"alimenta"},{"a":79,"b":8,"t":"alimenta"},{"a":79,"b":11,"t":"alimenta"},{"a":79,"b":15,"t":"alimenta"},{"a":79,"b":17,"t":"alimenta"},{"a":79,"b":21,"t":"alimenta"},{"a":80,"b":8,"t":"alimenta"},{"a":81,"b":61,"t":"alimenta","sim":1},{"a":82,"b":68,"t":"alimenta"},{"a":69,"b":61,"t":"alimenta"},{"a":69,"b":63,"t":"alimenta"},{"a":69,"b":65,"t":"alimenta"},{"a":70,"b":63,"t":"alimenta"},{"a":70,"b":65,"t":"alimenta"}]}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('dati-grafo').textContent);
  const P = new URLSearchParams(location.search);
  const BASE = 9;                                   // la scena è disegnata per 9 s
  const DURATA = Number(P.get('durata')) || BASE;
  const K = Math.max(0.75, Math.min(1.4, DURATA / BASE));   // con un'altra durata i tempi si allungano o si accorciano
  const NS = 'http://www.w3.org/2000/svg';
  // Strati: [inizio, fine] in secondi (a 9 s); il finale mostra il totale di nodi e relazioni
  const STRATI = { 1: [0.35, 1.75], 2: [1.75, 3.05], 3: [3.05, 4.35], 4: [4.35, 5.95], 5: [5.95, 7.35] };
  const FINALE = 7.45;
  const POP = 0.42;                                  // comparsa di un nodo
  const TRACCIA = 0.55;                              // disegno di un arco

  const fumo = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
  const morbido = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const rimbalzo = (x) => { const c = 1.6; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const tra = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const el = (nome, attr = {}, padre) => {
    const e = document.createElementNS(NS, nome);
    for (const [k, v] of Object.entries(attr)) e.setAttribute(k, v);
    if (padre) padre.appendChild(e);
    return e;
  };
  const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };

  const nodi = D.nodi || [];
  const archi = D.archi || [];
  const tipi = D.tipi || {};
  const coloreArco = D.colori_archi || {};

  // --- tempi: ogni nodo compare nel suo strato, da ovest a est (gli agenti da TwinCIRO verso i lati) ---
  const perStrato = {};
  for (const n of nodi) (perStrato[n.s] ||= []).push(n);
  for (const [s, lista] of Object.entries(perStrato)) {
    const [a, b] = STRATI[s];
    const chiave = (n) => (n.t === 'agente' ? Math.abs(n.x - 960) + (n.id === 'agente:twinciro' ? -1e6 : 0) : n.x);
    lista.sort((p, q) => chiave(p) - chiave(q) || p.id.localeCompare(q.id));
    lista.forEach((n, i) => { n.t0 = a + (lista.length > 1 ? i / (lista.length - 1) : 0) * (b - a) * 0.62; });
  }
  for (const e of archi) {
    const A = nodi[e.a];
    const B = nodi[e.b];
    e.t0 = Math.max(A.t0, B.t0) + POP * 0.5;
  }

  // --- forme ---
  const forma = {
    cerchio: (r) => `M${-r},0a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0`,
    rombo: (r) => `M0,${-r}L${r},0L0,${r}L${-r},0Z`,
    quadrato: (r) => `M${-r},${-r}H${r}V${r}H${-r}Z`,
    triangolo: (r) => `M0,${-r * 1.1}L${r * 1.05},${r * 0.75}L${-r * 1.05},${r * 0.75}Z`,
    esagono: (r) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 6 + (i * Math.PI) / 3; return `${i ? 'L' : 'M'}${(r * Math.cos(a)).toFixed(2)},${(r * Math.sin(a)).toFixed(2)}`; }).join('') + 'Z',
  };

  // --- archi: curve quadratiche (gli agenti si parlano con archi che salgono sopra le loro file) ---
  const gArchi = document.getElementById('archi');
  const gPart = document.getElementById('particelle');
  const STILE = {
    'vicino a': { w: 1.7, o: 0.42 },
    'servito da': { w: 1.3, o: 0.4 },
    'si svolge a': { w: 2.6, o: 0.7 },
    'flusso verso': { w: 1.6, o: 0.62 },
    'offerta a': { w: 1.6, o: 0.55 },
    monitora: { w: 1.3, o: 0.34, tratteggio: '5 6' },
    'parla con': { w: 1.8, o: 0.42 },
    alimenta: { w: 1.1, o: 0.26 },
  };
  const ORDINE = ['servito da', 'alimenta', 'vicino a', 'monitora', 'offerta a', 'si svolge a', 'flusso verso', 'parla con'];
  const punto = (c, s) => {
    const u = 1 - s;
    return [u * u * c.x0 + 2 * u * s * c.cx + s * s * c.x1, u * u * c.y0 + 2 * u * s * c.cy + s * s * c.y1];
  };
  for (const e of [...archi].sort((p, q) => ORDINE.indexOf(p.t) - ORDINE.indexOf(q.t))) {
    const A = nodi[e.a];
    const B = nodi[e.b];
    const dx = B.x - A.x;
    const dy = B.y - A.y;
    const L0 = Math.hypot(dx, dy) || 1;
    let cx;
    let cy;
    if (e.t === 'parla con') {
      cx = (A.x + B.x) / 2;
      cy = Math.max(200, Math.min(A.y, B.y) - (0.15 * Math.abs(dx) + 20));
    } else {
      const piega = (hash(A.id + B.id) % 2 ? 1 : -1) * (e.t === 'alimenta' ? 0.06 : 0.1);
      cx = (A.x + B.x) / 2 - (dy / L0) * piega * L0;
      cy = (A.y + B.y) / 2 + (dx / L0) * piega * L0;
    }
    const c = { x0: A.x, y0: A.y, cx, cy, x1: B.x, y1: B.y };
    let L = 0;
    let [px, py] = [A.x, A.y];
    for (let i = 1; i <= 24; i++) { const [x, y] = punto(c, i / 24); L += Math.hypot(x - px, y - py); px = x; py = y; }
    const st = STILE[e.t] || { w: 1.2, o: 0.4 };
    const larghezza = e.t === 'flusso verso' ? st.w + 3.2 * (e.q || 0) : st.w;
    e.c = c;
    e.L = L;
    e.st = st;
    e.p = el('path', {
      d: `M${A.x},${A.y}Q${cx.toFixed(1)},${cy.toFixed(1)} ${B.x},${B.y}`,
      fill: 'none', stroke: coloreArco[e.t] || '#9fb0d3', 'stroke-width': larghezza.toFixed(2), 'stroke-linecap': 'round', opacity: 0,
    }, gArchi);
    if (e.sim) e.p.setAttribute('stroke-dasharray', '3 7');
    // particelle: persone che arrivano (flussi), dati che entrano (alimenta), messaggi tra agenti (parla con)
    e.part = [];
    const quante = e.t === 'flusso verso' ? 1 + Math.round(3 * (e.q || 0)) : e.t === 'alimenta' ? 1 : e.t === 'parla con' ? (e.bi ? 2 : 1) : 0;
    for (let k = 0; k < quante; k++) {
      const inverso = e.t === 'parla con' && k % 2 === 1;
      e.part.push({
        el: el('circle', { r: e.t === 'flusso verso' ? 4 : 3.2, fill: coloreArco[e.t], opacity: 0 }, gPart),
        fase: ((hash(A.id + B.id) % 97) / 97 + k / quante) % 1,
        periodo: e.t === 'flusso verso' ? 1.5 : e.t === 'alimenta' ? 1.9 : 1.3,
        inverso,
      });
    }
  }

  // --- nodi ---
  const gNodi = document.getElementById('nodi');
  const gEt = document.getElementById('etichette');
  const img = [];
  for (const n of nodi) {
    const colore = tipi[n.t]?.colore || '#fff';
    const g = el('g', { opacity: 0 }, gNodi);
    const corpo = el('g', {}, g);
    n.g = g;
    n.corpo = corpo;
    if (n.id === 'agente:twinciro') {
      n.alone = el('circle', { r: n.r * 1.9, fill: '#ffb547', opacity: 0, filter: 'url(#alone)' }, corpo);
    }
    switch (n.t) {
      case 'luogo':
        if (n.cap) el('path', { d: forma.cerchio(n.r + 6), fill: 'none', stroke: colore, 'stroke-width': 1.5, opacity: 0.38 }, corpo);
        el('path', { d: forma.cerchio(n.r), fill: n.e || n.cap ? colore : 'rgb(56 214 240 / 0.78)', stroke: '#0a1020', 'stroke-width': 2 }, corpo);
        break;
      case 'evento':
        el('path', { d: forma.rombo(n.r * 1.18), fill: 'rgb(244 93 93 / 0.22)', stroke: colore, 'stroke-width': 3 }, corpo);
        break;
      case 'stazione':
        el('path', { d: forma.quadrato(n.r), fill: colore, stroke: '#0a1020', 'stroke-width': 1.5 }, corpo);
        break;
      case 'impresa':
        el('path', { d: forma.triangolo(n.r), fill: colore, stroke: '#0a1020', 'stroke-width': 2 }, corpo);
        break;
      case 'agente':
        el('path', { d: forma.esagono(n.r), fill: n.id === 'agente:twinciro' ? '#ffb547' : '#161f38', stroke: n.id === 'agente:twinciro' ? '#fff3dc' : colore, 'stroke-width': n.id === 'agente:twinciro' ? 3 : 2.5 }, corpo);
        break;
      case 'sensore':
        n.onde = [el('circle', { r: n.r, fill: 'none', stroke: colore, 'stroke-width': 2, opacity: 0.5 }, corpo), el('circle', { r: n.r, fill: 'none', stroke: colore, 'stroke-width': 2, opacity: 0.5 }, corpo)];
        el('circle', { r: n.r * 0.62, fill: '#161f38', stroke: colore, 'stroke-width': 2.5 }, corpo);
        el('circle', { r: n.r * 0.26, fill: colore }, corpo);
        break;
      case 'fonte': {
        el('circle', { r: n.r, fill: n.sf ? '#0f172a' : '#ffffff', stroke: n.sim ? colore : n.sf ? '#cbd5e1' : '#0a1020', 'stroke-width': n.sim ? 2.5 : 2, ...(n.sim ? { 'stroke-dasharray': '4 4' } : {}) }, corpo);
        if (n.sim) corpo.firstChild.setAttribute('fill', '#161f38');
        if (n.i) {
          const id = `clip-${n.id.replace(/[^a-z0-9]/gi, '-')}`;
          const cp = el('clipPath', { id }, document.querySelector('#grafo defs'));
          el('circle', { r: n.r - 3 }, cp);
          const lato = (n.r - 3) * 2 * 0.86;
          el('image', { href: n.i, x: -lato / 2, y: -lato / 2, width: lato, height: lato, 'clip-path': `url(#${id})`, preserveAspectRatio: 'xMidYMid meet' }, corpo);
          img.push(n.i);
        }
        break;
      }
      default:
        el('circle', { r: n.r, fill: colore }, corpo);
    }
    if (n.m && (n.t === 'agente' || n.t === 'evento' || (n.t === 'fonte' && !n.i))) {
      const fs = n.t === 'agente' ? n.r * 0.95 : n.r * 0.92;
      el('text', { class: 'em', 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': fs.toFixed(1), y: (fs * 0.04).toFixed(1) }, corpo).textContent = n.m;
    }
    // etichetta (solo i nodi importanti, scelti in genera.mjs)
    if (n.e) {
      const d = n.d || 20;
      const attr = { 'font-size': d, 'font-weight': n.t === 'agente' || n.t === 'evento' ? 700 : 650, opacity: 0 };
      if (n.l === 'sotto') Object.assign(attr, { x: n.x, y: n.y + n.r * (n.t === 'evento' ? 1.18 : 1) + 6 + d * 0.86, 'text-anchor': 'middle' });
      else if (n.l === 'sinistra') Object.assign(attr, { x: n.x - n.r - 8, y: n.y + d * 0.35, 'text-anchor': 'end' });
      else Object.assign(attr, { x: n.x + n.r + (n.cap ? 12 : 8), y: n.y + d * 0.35 });
      const t = el('text', attr, gEt);
      if (n.id === 'agente:twinciro') {
        t.setAttribute('font-weight', 800);
        el('tspan', { fill: '#38d6f0' }, t).textContent = 'Twin';
        el('tspan', { fill: '#ffb547' }, t).textContent = 'CIRO';
      } else t.textContent = n.e;
      n.et = t;
    }
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
  }

  // --- legenda in alto: si accende strato per strato, il conto sale con i nodi ---
  const chips = document.getElementById('chips');
  const ordineTipi = Object.keys(tipi);
  const miniForma = { cerchio: 'cerchio', rombo: 'rombo', quadrato: 'quadrato', triangolo: 'triangolo', esagono: 'esagono', onde: 'cerchio', logo: 'cerchio' };
  const chipTipi = ordineTipi.map((t) => {
    const c = document.createElement('div');
    c.className = 'chip';
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '-11 -11 22 22');
    const f = tipi[t].forma;
    const pieno = !['onde', 'logo'].includes(f) && t !== 'agente' && t !== 'evento';
    el('path', { d: forma[miniForma[f]](f === 'triangolo' ? 8 : 8.5), fill: pieno ? tipi[t].colore : t === 'fonte' ? '#ffffff' : '#161f38', stroke: tipi[t].colore, 'stroke-width': 2.2 }, s);
    c.appendChild(s);
    const b = document.createElement('b');
    const sp = document.createElement('span');
    sp.textContent = tipi[t].nome.split(' ')[0].toLowerCase();
    c.append(b, sp);
    chips.appendChild(c);
    return { t, c, b, tot: nodi.filter((n) => n.t === t).length, strato: tipi[t].strato, colore: tipi[t].colore };
  });
  const somma = document.createElement('div');
  somma.className = 'chip somma';
  somma.innerHTML = `<b>${nodi.length}</b>&nbsp;nodi&nbsp;·&nbsp;<b>${archi.length}</b>&nbsp;relazioni`;
  chips.appendChild(somma);

  const titolo = [document.getElementById('etichetta'), document.getElementById('titolo')];
  const nota = document.getElementById('nota');
  const camera = document.getElementById('camera');

  window.imposta = (tt) => {
    const t = tt / K;
    // titolo e nota
    titolo.forEach((e, i) => {
      const p = fumo(tra(t, 0.02 + i * 0.1, 0.62 + i * 0.1));
      e.style.opacity = p.toFixed(3);
      e.style.transform = `translateY(${((1 - p) * 22).toFixed(1)}px)`;
    });
    nota.style.opacity = (0.95 * fumo(tra(t, 0.5, 1.2))).toFixed(3);
    // legenda
    for (const c of chipTipi) {
      const [a] = STRATI[c.strato];
      const p = fumo(tra(t, a - 0.15, a + 0.25));
      const visti = nodi.filter((n) => n.t === c.t && t >= n.t0 + 0.05).length;
      c.c.style.opacity = (0.3 + 0.7 * p).toFixed(3);
      c.c.style.borderColor = p > 0.5 ? c.colore : '';
      if (c.b.textContent !== String(visti)) c.b.textContent = String(visti);
    }
    const ps = fumo(tra(t, FINALE, FINALE + 0.5));
    somma.style.opacity = ps.toFixed(3);
    somma.style.transform = `translateX(${((1 - ps) * -14).toFixed(1)}px)`;
    // camera: un leggero arretramento
    const s = 1.03 - 0.03 * morbido(tra(t, 0, BASE));
    camera.setAttribute('transform', `translate(960 560) scale(${s.toFixed(5)}) translate(-960 -560)`);
    // nodi
    for (const n of nodi) {
      const k = tra(t, n.t0, n.t0 + POP);
      const sc = rimbalzo(k);
      n.g.setAttribute('opacity', fumo(tra(t, n.t0, n.t0 + POP * 0.5)).toFixed(3));
      n.corpo.setAttribute('transform', `scale(${Math.max(0.001, sc).toFixed(4)})`);
      if (n.et) n.et.setAttribute('opacity', fumo(tra(t, n.t0 + 0.12, n.t0 + 0.12 + POP)).toFixed(3));
      if (n.onde) {
        n.onde.forEach((o, i) => {
          const f = t > n.t0 ? ((t - n.t0) / 1.6 + i * 0.5) % 1 : 0;
          o.setAttribute('r', (n.r * (0.7 + 1.1 * f)).toFixed(2));
          o.setAttribute('opacity', (t > n.t0 ? 0.6 * (1 - f) : 0).toFixed(3));
        });
      }
      if (n.alone) {
        const a = tra(t, n.t0, n.t0 + 0.6);
        n.alone.setAttribute('opacity', (a * (0.42 + 0.12 * Math.sin(t * 3.1))).toFixed(3));
      }
    }
    // archi: si disegnano, brillano un momento, poi restano tenui; le particelle scorrono
    for (const e of archi) {
      const k = tra(t, e.t0, e.t0 + TRACCIA);
      if (k <= 0) {
        e.p.setAttribute('opacity', 0);
      } else {
        const nuovo = 1 - tra(t, e.t0 + TRACCIA, e.t0 + TRACCIA + 1.0);
        e.p.setAttribute('opacity', Math.min(1, e.st.o + 0.45 * nuovo).toFixed(3));
        if (!e.sim) {
          if (k < 1) {
            e.p.setAttribute('stroke-dasharray', `${e.L.toFixed(1)} ${e.L.toFixed(1)}`);
            e.p.setAttribute('stroke-dashoffset', (e.L * (1 - morbido(k))).toFixed(1));
          } else if (e.st.tratteggio) {
            e.p.setAttribute('stroke-dasharray', e.st.tratteggio);
            e.p.removeAttribute('stroke-dashoffset');
          } else {
            e.p.removeAttribute('stroke-dasharray');
            e.p.removeAttribute('stroke-dashoffset');
          }
        } else {
          e.p.setAttribute('opacity', (e.st.o * morbido(k) + 0.3 * nuovo).toFixed(3));
        }
      }
      for (const q of e.part) {
        const via = t - (e.t0 + TRACCIA * 0.6);
        if (via <= 0) { q.el.setAttribute('opacity', 0); continue; }
        let s = (via / q.periodo + q.fase) % 1;
        if (q.inverso) s = 1 - s;
        const [x, y] = punto(e.c, s);
        q.el.setAttribute('cx', x.toFixed(1));
        q.el.setAttribute('cy', y.toFixed(1));
        const bordo = Math.min(s, 1 - s);
        q.el.setAttribute('opacity', (fumo(tra(via, 0, 0.4)) * Math.min(1, bordo * 7) * 0.95).toFixed(3));
      }
    }
  };

  window.pronta = (async () => {
    await Promise.all([...new Set(img)].map((src) => new Promise((ok) => {
      const i = new Image();
      i.onload = () => (i.decode ? i.decode().then(ok, ok) : ok());
      i.onerror = ok;
      i.src = src;
    })));
    await document.fonts.ready;
    window.imposta(0);
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    return { durata: DURATA };
  })();

  // Nel browser (senza ?fotogrammi) la scena gira da sola, in loop
  window.pronta.then(() => {
    if (P.has('fotogrammi')) return;
    const t0 = performance.now();
    const giro = () => { window.imposta(((performance.now() - t0) / 1000) % (DURATA + 1.5)); requestAnimationFrame(giro); };
    giro();
  });
})();
</script>
</body>
</html>
