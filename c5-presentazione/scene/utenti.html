<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>TwinCIRO · due utenti</title>
<link rel="stylesheet" href="stile.css">
<style>
  /* Due utenti affiancati: chi visita (turista su WhatsApp) e chi governa (Polizia Locale in sala operativa).
     Scena corta (6 s): le due schede entrano insieme entro 1 s, poi restano ferme con un lento avvicinamento.
     Icone emoji generiche: nessun marchio di WhatsApp o della Polizia Locale, solo testo. */
  .scena { position: absolute; inset: 0; animation: avvicina 6.5s linear both; transform-origin: 50% 45%; }
  @keyframes avvicina { from { transform: scale(1); } to { transform: scale(1.025); } }
  .testa { position: absolute; left: 0; right: 0; top: 86px; text-align: center; }
  .testa .etichetta { font-size: 27px; }
  .coppia { position: absolute; left: 150px; right: 150px; top: 172px; height: 660px; display: grid; grid-template-columns: 1fr 1fr; gap: 70px; }
  .utente { border-radius: 38px; background: rgb(22 33 59 / 0.93); border: 2px solid var(--bordo); padding: 50px 48px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .utente.visita { border-color: rgb(255 181 71 / 0.65); box-shadow: 0 0 70px rgb(255 181 71 / 0.12); }
  .utente.governa { border-color: rgb(56 214 240 / 0.65); box-shadow: 0 0 70px rgb(56 214 240 / 0.12); }
  .avatar { position: relative; width: 196px; height: 196px; border-radius: 50%; display: grid; place-items: center; font-size: 116px; line-height: 1; }
  .visita .avatar { background: radial-gradient(circle at 35% 30%, #6b4810, #2a1c07); box-shadow: 0 0 0 5px var(--ciro); }
  .governa .avatar { background: radial-gradient(circle at 35% 30%, #145868, #08222a); box-shadow: 0 0 0 5px var(--twin); }
  .distintivo { position: absolute; right: -16px; bottom: -8px; width: 88px; height: 88px; border-radius: 50%; background: #0f182c;
    display: grid; place-items: center; font-size: 50px; }
  .visita .distintivo { border: 4px solid var(--ciro); }
  .governa .distintivo { border: 4px solid var(--twin); }
  .chi { margin-top: 38px; font-size: 28px; }
  .visita .chi { color: var(--ciro); }
  .utente h2 { margin: 12px 0 20px; font-size: 64px; line-height: 1.06; font-weight: 800; letter-spacing: -0.02em; }
  .utente p { margin: 0; font-size: 40px; line-height: 1.3; color: #dbe4f7; font-weight: 500; }
  .utente p b { font-weight: 800; color: var(--testo); }
</style>
</head>
<body>
<div class="scena">
  <div class="testa a" style="--d:0s"><span class="etichetta">Due utenti · una sola città</span></div>
  <div class="coppia">
    <div class="utente visita a" style="--d:.15s">
      <div class="avatar">👩<span class="distintivo c" style="--d:.75s">🛳️</span></div>
      <div class="etichetta chi">Chi visita</div>
      <h2>Marta,<br>crocierista</h2>
      <p>Scrive a <span class="marchio"><span class="twin">Twin</span><span class="ciro">CIRO</span></span><br>su WhatsApp</p>
    </div>
    <div class="utente governa a" style="--d:.3s">
      <div class="avatar">👮<span class="distintivo c" style="--d:.9s">🖥️</span></div>
      <div class="etichetta chi">Chi governa</div>
      <h2>Operatore della<br>Polizia Locale</h2>
      <p>In sala operativa:<br><b>dashboard</b> e <b>gemello 3D</b></p>
    </div>
  </div>
</div>
<script>
// Solo animazioni CSS: il renderer le porta al tempo t (vedi rendi_html.mjs); nel browser si vedono da sole.
window.pronta = document.fonts.ready.then(() => ({ durata: Number(new URLSearchParams(location.search).get('durata')) || 6 }));
</script>
</body>
</html>
