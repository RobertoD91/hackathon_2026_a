# Napoli Agentic City con Docker.
#   docker compose up -d                 broker MQTT + città (agenti, gemello SUMO, API su :8080)
#   docker compose run --rm sala         sala operativa a schermo intero nel terminale
#   docker compose logs -f citta         dialogo tra agenti a righe
# Gli ESP32 del plastico si collegano al broker sulla porta 1883 del portatile.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  citta:
    build: .
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    environment:
      # Chiavi e opzioni prese dall'ambiente della macchina (mai scritte qui).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      C5_LLM: ${C5_LLM:-auto}
      C5_MODELLO: ${C5_MODELLO:-claude-opus-5-5}
      C5_API_TOKEN: ${C5_API_TOKEN:-}
    command: >
      python avvia.py --broker mosquitto --senza-sala
      --velocita ${C5_VELOCITA:-20} --inizio ${C5_INIZIO:-13:00} --meteo ${C5_METEO:-scenario}
    # A fine giornata simulata il processo esce: si riparte da capo.
    restart: unless-stopped

  sala:
    build: .
    depends_on:
      - citta
    command: python -m citta.sala --broker mosquitto
    tty: true
    stdin_open: true
    profiles: ["sala"]
