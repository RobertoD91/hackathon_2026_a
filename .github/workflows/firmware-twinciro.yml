# Compila il firmware del nodo TwinCiro (c5-agentic-city/firmware/twinciro-nodo) per ESP32, ESP32-S3 ed ESP32-C3
# e pubblica i binari nel flasher web (c5-agentic-city/flasher/). Parte SOLO a mano:
# GitHub → Actions → "Firmware TwinCiro" → Run workflow (oppure: gh workflow run firmware-twinciro.yml).
name: Firmware TwinCiro

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Nota della versione (facoltativa)"
        required: false
        default: ""

permissions:
  contents: write   # commit dei binari nel flasher
  actions: write    # rilancia il deploy di GitHub Pages

concurrency:
  group: firmware-twinciro
  cancel-in-progress: false

jobs:
  compila:
    runs-on: ubuntu-latest
    env:
      SKETCH: c5-agentic-city/firmware/twinciro-nodo
      FLASHER: c5-agentic-city/flasher/firmware
      CORE: esp32:esp32@3.3.12
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache del core ESP32
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.CORE }}-wifimanager-pubsub-arduinojson-v1

      - name: Core e librerie
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "$CORE"
          arduino-cli lib install "WiFiManager@2.0.17" "PubSubClient@2.8" "ArduinoJson@7.4.3"

      - name: Versione
        id: versione
        run: |
          V="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          echo "versione=$V" >> "$GITHUB_OUTPUT"
          echo "#define TWINCIRO_VERSIONE \"$V\"" > "$SKETCH/versione.h"

      - name: Compila (ESP32, ESP32-S3, ESP32-C3)
        run: |
          mkdir -p "$FLASHER"
          for coppia in "esp32:esp32:esp32 esp32" "esp32:esp32:esp32s3 esp32s3" "esp32:esp32:esp32c3 esp32c3"; do
            set -- $coppia
            arduino-cli compile --fqbn "$1" --export-binaries --output-dir "build/$2" "$SKETCH"
            # Il merged.bin è riempito fino a 4 MB con 0xFF: togliamo il riempimento finale (resta ~1,1 MB, allineato a 4 KB).
            python3 -c "import sys; d=open(sys.argv[1],'rb').read().rstrip(b'\xff'); n=(len(d)+4095)//4096*4096; open(sys.argv[2],'wb').write(d+b'\xff'*(n-len(d)))" \
              "build/$2/twinciro-nodo.ino.merged.bin" "$FLASHER/twinciro-nodo-$2.bin"
          done
          ls -la "$FLASHER"

      - name: Manifest per ESP Web Tools
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
          NOTA: ${{ inputs.note }}
        run: |
          cat > "$FLASHER/manifest.json" <<EOF
          {
            "name": "TwinCiro nodo (semaforo o sensore)",
            "version": "$VERSIONE",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32",    "parts": [{ "path": "twinciro-nodo-esp32.bin",   "offset": 0 }] },
              { "chipFamily": "ESP32-S3", "parts": [{ "path": "twinciro-nodo-esp32s3.bin", "offset": 0 }] },
              { "chipFamily": "ESP32-C3", "parts": [{ "path": "twinciro-nodo-esp32c3.bin", "offset": 0 }] }
            ]
          }
          EOF
          python3 - <<'PY'
          import json, os
          json.dump({"versione": os.environ["VERSIONE"], "nota": os.environ.get("NOTA", ""),
                     "commit": os.environ["GITHUB_SHA"], "core": os.environ["CORE"]},
                    open(os.path.join(os.environ["FLASHER"], "info.json"), "w"), ensure_ascii=False, indent=2)
          PY

      - name: Pubblica i binari su master
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FLASHER"
          git commit -m "Firmware TwinCiro $VERSIONE (compilato dall'action)"
          for i in 1 2 3 4; do git pull --rebase origin master && git push origin HEAD:master && break; sleep $((i * 5)); done

      - name: Rilancia GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref master
