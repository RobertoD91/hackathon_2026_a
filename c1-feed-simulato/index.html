<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clienti che non esistono — Feed simulato</title>
    <meta name="description" content="Prevedi come reagirà il pubblico a un annuncio prima di spendere un euro: pubblico sintetico, CTR per segmento, fascia di CPM e motivi." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d28d9'/%3E%3Ccircle cx='11' cy='13' r='4' fill='white'/%3E%3Ccircle cx='21' cy='13' r='4' fill='white' opacity='.6'/%3E%3Crect x='6' y='20' width='20' height='5' rx='2.5' fill='white'/%3E%3C/svg%3E" />
    <!-- server.js scrive qui content="api": su GitHub Pages resta vuoto e la pagina lavora solo nel browser -->
    <meta name="c1-backend" content="" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span></span><span></span></div>
        <div>
          <h1>Clienti che non esistono</h1>
          <p class="sub">Feed simulato · prevedi CTR e CPM prima di spendere un euro</p>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="annunci">1 · Annunci</button>
        <button role="tab" data-view="simulazione">2 · Feed e previsione</button>
        <button role="tab" data-view="verifica">3 · Verifica</button>
        <button role="tab" data-view="metodo">Come funziona</button>
      </nav>
      <div id="mode-badge" class="mode-badge" title="Modalità di esecuzione">…</div>
    </header>

    <main id="app" aria-live="polite"></main>

    <div id="progress" class="progress hidden" role="status">
      <div class="progress-card">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong id="progress-title">Le persone virtuali stanno scorrendo il feed…</strong>
          <div class="bar"><div id="progress-bar"></div></div>
          <small id="progress-msg"></small>
        </div>
      </div>
    </div>
    <div id="toast" class="toast hidden" role="alert"></div>
    <input type="file" id="file-import" accept=".json,.csv,.tsv,.txt,application/json,text/csv" hidden />
    <input type="file" id="file-results" accept=".json,.csv,.tsv,.txt" hidden />

    <script type="module" src="app.js"></script>
  </body>
</html>
