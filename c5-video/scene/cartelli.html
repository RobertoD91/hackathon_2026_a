<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Cartelli del video</title>
<link rel="stylesheet" href="stile.css">
<style>
  .centro { position: absolute; left: 0; right: 0; top: 0; height: 950px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  /* titolo */
  .wordmark { font-size: 230px; line-height: 1; margin: 18px 0 10px; }
  .sotto { font-size: 50px; font-weight: 600; margin-top: 26px; }
  .spiega { margin-top: 26px; font-size: 26px; color: var(--tenue); }
  .linea { width: 760px; height: 4px; margin-top: 30px; border-radius: 2px; background: linear-gradient(90deg, var(--twin), var(--ciro));
    transform-origin: left; animation: allarga 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
  .alone { position: absolute; left: 50%; top: 44%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
    background: radial-gradient(circle, rgb(56 214 240 / 0.12), transparent 62%); animation: respira 6s ease-in-out infinite; }
  @keyframes respira { 0%,100% { transform: scale(0.94); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

  /* elenco */
  .elenco { position: absolute; left: 120px; right: 120px; top: 80px; }
  .elenco h1 { margin: 0 0 40px; font-size: 66px; letter-spacing: -0.02em; font-weight: 800; }
  .griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .tessera { background: rgb(22 33 59 / 0.9); border: 1px solid var(--bordo); border-radius: 26px; padding: 30px 34px; min-height: 300px; }
  .tessera .ic { font-size: 54px; line-height: 1; }
  .tessera h3 { margin: 16px 0 10px; font-size: 36px; color: var(--ciro); }
  .tessera p { margin: 0; font-size: 31px; line-height: 1.35; }
  .tessera .fonte { margin-top: 14px; font-size: 21px; color: var(--tenue); }
  .righe-e { display: flex; flex-direction: column; gap: 16px; }
  .rigae { display: flex; align-items: center; gap: 30px; background: rgb(22 33 59 / 0.9); border: 1px solid var(--bordo); border-radius: 22px; padding: 20px 30px; }
  .rigae .ic { font-size: 50px; width: 64px; text-align: center; flex: none; }
  .rigae h3 { margin: 0 0 4px; font-size: 34px; color: var(--ciro); }
  .rigae p { margin: 0; font-size: 29px; color: #dbe4f7; }
  .piede { margin-top: 22px; font-size: 21px; color: var(--tenue); }

  /* segnaposto per le riprese vere */
  .qui { position: absolute; left: 160px; right: 160px; top: 150px; height: 700px; border: 5px dashed var(--corallo); border-radius: 34px;
    background: repeating-linear-gradient(135deg, rgb(255 122 122 / 0.06) 0 26px, transparent 26px 52px);
    display: flex; flex-direction: column; justify-content: center; padding: 0 90px; }
  .qui .etichetta { color: var(--corallo); font-size: 30px; }
  .qui h2 { margin: 18px 0 22px; font-size: 64px; line-height: 1.12; font-weight: 800; }
  .qui p { margin: 0; font-size: 32px; color: #c8d3ec; line-height: 1.4; }
  .qui code { display: inline-block; margin-top: 34px; font: 600 30px 'DejaVu Sans Mono', monospace; color: var(--ciro); background: #1b2440; padding: 10px 18px; border-radius: 12px; }

  /* chiusura */
  .invito { margin-top: 44px; display: inline-flex; gap: 16px; align-items: center; background: var(--ciro); color: #1b1300; font-size: 42px; font-weight: 800; padding: 18px 40px; border-radius: 60px; }
  .squadra { margin-top: 52px; font-size: 36px; font-weight: 600; }
  .evento { margin-top: 12px; font-size: 25px; color: var(--tenue); }
  .link { margin-top: 10px; font-size: 25px; color: var(--twin); }

  /* testata trasparente sopra i video */
  body.trasparente { background: transparent; }
  .testata { position: absolute; left: 0; right: 0; top: 0; height: 96px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px; background: rgb(10 16 32); }
  .testata::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--twin), var(--ciro)); }
  .testata .etichetta { font-size: 18px; }
  .testata .t { font-size: 33px; font-weight: 700; margin-top: 3px; }
  .testata .marchio { font-size: 36px; }
  .velo { position: absolute; inset: 0; }
  .kpi-riga { position: absolute; left: 0; right: 0; top: 742px; display: flex; justify-content: center; gap: 90px; }
  .kpi { display: flex; align-items: baseline; gap: 16px; }
  .kpi b { font-size: 76px; font-weight: 800; color: var(--verde); letter-spacing: -0.02em; }
  .kpi span { font-size: 28px; color: #dbe4f7; }
  .kpi-nota { position: absolute; left: 0; right: 0; top: 856px; text-align: center; font-size: 22px; color: var(--tenue); }

  /* riserva IoT: cosa pubblica un nodo (formato reale del firmware) e come si installa */
  .iot { position: absolute; left: 120px; right: 120px; top: 96px; bottom: 130px; display: flex; flex-direction: column; justify-content: center; }
  .iot h1 { margin: 0 0 12px; font-size: 66px; font-weight: 800; letter-spacing: -0.02em; }
  .iot .sotto-t { font-size: 32px; color: #c8d3ec; margin-bottom: 48px; }
  .flusso { display: grid; grid-template-columns: 360px 1fr 360px; gap: 0; align-items: center; }
  .nodo { background: rgb(22 33 59 / 0.95); border: 2px solid var(--bordo); border-radius: 24px; padding: 30px 30px; }
  .nodo .ic { font-size: 60px; }
  .nodo h3 { margin: 10px 0 8px; font-size: 38px; }
  .nodo p { margin: 0; font-size: 26px; color: #c8d3ec; line-height: 1.35; }
  .nodo.ag { border-color: var(--viola); } .nodo.ag h3 { color: var(--viola); }
  .nodo.hw { border-color: var(--twin); } .nodo.hw h3 { color: var(--twin); }
  .filo { position: relative; margin: 0 26px; }
  .msg { background: #0c1426; border: 1px solid #27406b; border-radius: 16px; padding: 18px 22px; margin: 14px 0;
    font: 500 24px/1.5 'DejaVu Sans Mono', monospace; color: #cfe7ff; }
  .msg b { color: var(--twin); font-weight: 600; }
  .msg i { color: #8ea0c8; font-style: normal; }
  .freccia { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--twin), var(--viola)); position: relative; margin: 6px 0; }
  .freccia::after { content: ''; position: absolute; right: -2px; top: -7px; border: 9px solid transparent; border-left: 14px solid var(--viola); }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
  .chip-i { font-size: 27px; font-weight: 700; padding: 10px 20px; border-radius: 30px; background: #16213b; border: 1px solid var(--bordo); }
  .passi-f { display: flex; flex-direction: column; gap: 18px; }
  .passo-f { display: flex; gap: 24px; align-items: center; background: rgb(22 33 59 / 0.95); border: 1px solid var(--bordo); border-radius: 20px; padding: 26px 30px; }
  .passo-f .n { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800; background: var(--twin); color: #0a1020; flex: none; }
  .passo-f p { margin: 0; font-size: 34px; }
  .passo-f code { font: 600 30px 'DejaVu Sans Mono', monospace; color: var(--ciro); }
  .fonte-r { margin-top: 34px; font-size: 24px; color: var(--tenue); }

  /* notifica di CiroGPT sopra un video (telefono generico, nessun marchio) */
  .notifica { position: absolute; border-radius: 26px; background: rgb(246 248 252 / 0.97); color: #111827; padding: 18px 22px 20px;
    box-shadow: 0 24px 60px rgb(0 0 0 / 0.55), 0 0 0 2px rgb(255 181 71 / 0.85); }
  .notifica .capo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .notifica .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--twin), var(--ciro));
    display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #0a1020; flex: none; }
  .notifica .chi { font-size: 21px; font-weight: 800; }
  .notifica .quando { font-size: 17px; color: #6b7280; margin-left: auto; }
  .notifica .tit { font-size: 15px; font-weight: 800; letter-spacing: 0.06em; color: #b26b00; margin-bottom: 4px; }
  .notifica p { margin: 0; font-size: 22px; line-height: 1.38; }
  .notifica .nota-n { margin-top: 10px; font-size: 15px; color: #6b7280; }
</style>
</head>
<body>
<div id="radice"></div>
<script>
'use strict';
const P = new URLSearchParams(location.search);
const id = P.get('id');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const marchio = (cl = '') => `<span class="marchio ${cl}"><span class="twin">Twin</span><span class="ciro">Ciro</span></span>`;
const r = document.getElementById('radice');

window.pronta = (async () => {
  const s = await (await fetch('scaletta.json', { cache: 'no-store' })).json();
  if (id === 'testata') {
    document.body.className = 'trasparente';
    const sc = s.scene.find((x) => x.id === P.get('scena'));
    r.innerHTML = `<div class="testata"><div><div class="etichetta">${esc(sc.testata.etichetta)}</div><div class="t">${esc(sc.testata.testo)}</div></div>${marchio()}</div>`;
  } else if (id === 'velo-regata' || id === 'velo-sumo' || id === 'velo-apertura') {
    // Scurisce le parti dei video già pronti che non servono (vecchio titolo in alto, riquadri dei KPI in basso)
    document.body.className = 'trasparente';
    const regata = 'linear-gradient(180deg, rgb(10 16 32 / 1) 0px, rgb(10 16 32 / 1) 112px, rgb(10 16 32 / 0) 190px, rgb(10 16 32 / 0) 780px, rgb(10 16 32 / 0.97) 870px, rgb(10 16 32 / 1) 900px, rgb(10 16 32 / 1) 1080px)';
    // Apertura: ritaglio più largo (si vede Mergellina), quindi copro anche la legenda in alto a sinistra
    const g = id === 'velo-regata' ? regata
      : id === 'velo-apertura' ? `radial-gradient(900px 380px at 0 0, rgb(10 16 32 / 1) 72%, rgb(10 16 32 / 0) 100%), ${regata}`
      : 'linear-gradient(180deg, rgb(10 16 32 / 0.97) 0px, rgb(10 16 32 / 0.97) 94px, rgb(10 16 32 / 0) 96px, rgb(10 16 32 / 0) 708px, rgb(10 16 32 / 1) 716px, rgb(10 16 32 / 1) 1080px)';
    const c = s.cartelli[id] || {};
    const numeri = (c.numeri || []).map((n) => `<div class="kpi"><b>${esc(n.valore)}</b><span>${esc(n.testo)}</span></div>`).join('');
    r.innerHTML = `<div class="velo" style="background:${g}"></div>`
      + (numeri ? `<div class="kpi-riga">${numeri}</div><div class="kpi-nota">${esc(c.nota || '')}</div>` : '');
  } else if (s.cartelli[id]?.tipo === 'notifica') {
    // Notifica di CiroGPT: il testo è quello dell'avviso in chat.json (lo stesso della scena della chat)
    document.body.className = 'trasparente';
    const c = s.cartelli[id];
    const chat = await (await fetch('chat.json', { cache: 'no-store' })).json();
    const avviso = chat.messaggi.find((m) => m.tipo === 'avviso') || {};
    const testo = String(c.testo || avviso.testo || '').replace(/^📣\s*/, '');
    const { x = 1400, y = 150, w = 470 } = c.posizione || {};
    r.innerHTML = `<div class="notifica" style="left:${x}px;top:${y}px;width:${w}px">
      <div class="capo"><div class="av">C</div><div class="chi">CiroGPT</div><div class="quando">${esc(c.quando || 'adesso')}</div></div>
      <div class="tit">📣 AVVISO DELLA CITTÀ</div><p>${esc(testo)}</p>${c.nota ? `<div class="nota-n">${esc(c.nota)}</div>` : ''}</div>`;
  } else {
    const c = s.cartelli[id];
    if (!c) throw new Error(`cartello sconosciuto: ${id}`);
    if (c.tipo === 'titolo') {
      r.innerHTML = `<div class="alone"></div><div class="centro">
        <div class="etichetta a" style="--d:.1s">${esc(c.sopra)}</div>
        <div class="wordmark c" style="--d:.3s">${marchio()}</div>
        <div class="linea" style="--d:.9s"></div>
        <div class="sotto a" style="--d:1.3s">${esc(c.sotto)}</div>
        <div class="spiega a" style="--d:2.2s">${esc(c.spiega)}</div></div>`;
    } else if (c.tipo === 'elenco') {
      const tessere = c.voci.length <= 4;
      const passo = Number(P.get('passo')) || (tessere ? 1.1 : 1.0);
      const voci = c.voci.map((v, i) => {
        const d = `--d:${(v.d ?? 0.6 + i * passo).toFixed(2)}s`;
        return tessere
          ? `<div class="tessera a" style="${d}"><div class="ic">${v.icona}</div><h3>${esc(v.titolo)}</h3><p>${esc(v.testo)}</p>${v.fonte ? `<div class="fonte">${esc(v.fonte)}</div>` : ''}</div>`
          : `<div class="rigae a" style="${d}"><div class="ic">${v.icona}</div><div><h3>${esc(v.titolo)}</h3><p>${esc(v.testo)}</p></div></div>`;
      }).join('');
      r.innerHTML = `<div class="elenco"><h1 class="a">${esc(c.titolo)}</h1>
        <div class="${tessere ? 'griglia' : 'righe-e'}">${voci}</div>
        ${c.piede ? `<div class="piede f" style="--d:${(Math.max(...c.voci.map((v, i) => v.d ?? 0.6 + i * passo)) + 1).toFixed(2)}s">${esc(c.piede)}</div>` : ''}</div>`;
    } else if (c.tipo === 'segnaposto') {
      r.innerHTML = `<div class="qui c"><div class="etichetta">Qui va una ripresa reale · ${esc(c.durata)}</div>
        <h2>${esc(c.cosa)}</h2><p>${esc(c.come)}</p><div><code>${esc(c.file)}</code></div></div>`;
    } else if (c.tipo === 'riserva-nodo') {
      // Riserva della scena 06 senza ripresa vera: il formato dei messaggi del firmware (nessun valore inventato)
      r.innerHTML = `<div class="iot"><h1 class="a" style="--d:.1s">${esc(c.titolo)}</h1><div class="sotto-t a" style="--d:.3s">${esc(c.sotto)}</div>
        <div class="flusso">
          <div class="nodo hw a" style="--d:.6s"><div class="ic">📟</div><h3>Nodo ESP32</h3><p>sensore di passaggio, badge WHY2025</p></div>
          <div class="filo">
            ${c.messaggi.map((m, i) => `<div class="msg a" style="--d:${(1.2 + i * 1.3).toFixed(1)}s"><b>${esc(m.topic)}</b><br><i>${esc(m.contenuto)}</i></div>`).join('')}
            <div class="freccia f" style="--d:1.0s"></div>
          </div>
          <div class="nodo ag a" style="--d:${(1.4 + c.messaggi.length * 1.3).toFixed(1)}s"><div class="ic">👥</div><h3>Agente Folla</h3><p>somma celle e sensori, stima per zona</p></div>
        </div>
        <div class="fonte-r f" style="--d:4.6s">${esc(c.fonte)}</div></div>`;
    } else if (c.tipo === 'riserva-flasher') {
      // Riserva della scena 07 senza ripresa vera: come si installa il firmware dal browser
      r.innerHTML = `<div class="iot"><h1 class="a" style="--d:.1s">${esc(c.titolo)}</h1><div class="sotto-t a" style="--d:.3s">${esc(c.sotto)}</div>
        <div class="passi-f">${c.passi.map((x, i) => `<div class="passo-f a" style="--d:${(0.6 + i * 0.9).toFixed(1)}s"><div class="n">${i + 1}</div><p>${x.codice ? `<code>${esc(x.testo)}</code>` : esc(x.testo)}</p></div>`).join('')}</div>
        <div class="chips">${c.chips.map((x, i) => `<span class="chip-i a" style="--d:${(3.4 + i * 0.3).toFixed(1)}s">${esc(x)}</span>`).join('')}</div></div>`;
    } else if (c.tipo === 'chiusura') {
      r.innerHTML = `<div class="alone"></div><div class="centro">
        <div class="wordmark c" style="--d:.1s;font-size:190px">${marchio()}</div>
        <div class="sotto a" style="--d:.7s">${esc(c.sotto)}</div>
        <div class="invito a" style="--d:1.4s">💬 ${esc(c.invito)}</div>
        <div class="squadra a" style="--d:2.2s">${esc(c.squadra)}</div>
        <div class="evento a" style="--d:2.6s">${esc(c.evento)}</div>
        <div class="link a" style="--d:2.9s">${esc(c.link)}</div></div>`;
    }
  }
  await document.fonts.ready;
  return {};
})();
</script>
</body>
</html>
